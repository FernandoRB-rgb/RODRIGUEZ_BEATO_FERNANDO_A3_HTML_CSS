<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini tienda</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
 
<div class="cabecera">
    <h1>Mini tienda DAW</h1>
</div>
 
<div class="menu">
    <a href="#productos">Productos</a>
    <a href="#ofertas">Ofertas</a>
    <a href="#contacto">Contacto</a>
</div>
 
<div class="contenedor" id="productos">
    <div class="tarjeta">
        <h2>Teclado</h2>
        <p class="precio">39.90 €</p>
        <a class="boton" href="#">Ver producto</a>
    </div>
 
    <div class="tarjeta destacada" id="ofertas">
        <h2>Ratón</h2>
        <p class="precio">19.90 €</p>
        <a class="boton" href="#">Ver producto</a>
    </div>
 
    <div class="tarjeta">
        <h2>Monitor</h2>
        <p class="precio">149.00 €</p>
        <a class="boton" href="#">Ver producto</a>
    </div>
</div>
 
<div class="pie" id="contacto">
    <p>Contacto: tienda@ejemplo.local</p>
</div>
 
</body>
</html>
